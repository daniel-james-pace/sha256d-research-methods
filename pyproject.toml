[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sha256d-research-methods-demos"
version = "0.1.0"
description = "Demonstration modules accompanying the SHA-256d research methods README"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[tool.setuptools.packages.find]
where = ["src"]
